openapi: 3.0.0
info:
  title: yt-cipher API
  description: A web service for solving YouTube's cipher challenges.
  version: 1.0.0
servers:
  - url: /
paths:
  /decrypt_signature:
    post:
      summary: Decrypts a signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encrypted_signature:
                  type: string
                n_param:
                  type: string
                player_url:
                  type: string
      responses:
        '200':
          description: Decrypted signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  decrypted_signature:
                    type: string
                  decrypted_n_sig:
                    type: string
  /get_sts:
    post:
      summary: Gets a Short-Term Secret (STS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_url:
                  type: string
      responses:
        '200':
          description: STS value
          content:
            application/json:
              schema:
                type: object
                properties:
                  sts:
                    type: string
  /resolve_url:
    post:
      summary: Resolves a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stream_url:
                  type: string
                player_url:
                  type: string
                encrypted_signature:
                  type: string
                signature_key:
                  type: string
                n_param:
                  type: string
      responses:
        '200':
          description: Resolved URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved_url:
                    type: string

  /get_po_token:
    post:
      summary: Generates a YouTube PO Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitorData:
                  type: string
                  description: YouTube visitor data (visitorData)
                videoId:
                  type: string
                  description: YouTube video ID (for video-specific PoToken)
      responses:
        '200':
          description: PO Token generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  visitorDataToken:
                    type: string
                    description: Visitor data binding PoToken
                  visitorData:
                    type: string
                    description: Original visitor data
                  videoIdToken:
                    type: string
                    description: Video ID binding PoToken
                  expiresAt:
                    type: string
                    format: date-time
                    description: Token expiration time
        '404':
          description: Failed to generate PO Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string